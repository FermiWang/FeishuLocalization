[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-archive"
version = "0.4.0"
description = "Official-API-based local offline message, knowledge-base and mail reader for Feishu"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - no license granted"}
authors = [{name = "FermiWang"}]
dependencies = []

[project.scripts]
feishu-archive = "feishu_archive.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feishu_archive = ["static/*"]
